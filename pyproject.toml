[project]
name = "spectral-neuron-component"
version = "0.1.0"
description = "Scikit-learn spectral neurons with analytical gradients and NumPy fitters."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.1", "scipy>=1.15", "scikit-learn>=1.6"]

[dependency-groups]
demos = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.11.26,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spectral_neuron"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
